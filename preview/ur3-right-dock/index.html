 const zoom=document.getElementById('navZoom'),number=document.getElementById('navZoomNumber');function setZoom(n){let v=Math.max(5,Math.min(300,Number(n)||100));zoom.value=v;number.value=v};zoom.addEventListener('input',()=>number.value=zoom.value);number.addEventListener('change',()=>setZoom(number.value));document.getElementById('navMinus').addEventListener('click',()=>setZoom(Number(zoom.value)-10));document.getElementById('navPlus').addEventListener('click',()=>setZoom(Number(zoom.value)+10));document.querySelectorAll('[data-preview-note]').forEach(b=>b.addEventListener('click',()=>setZoom(b.dataset.previewNote==='100%'?100:38)));

 // tab-order-r22: tab drag only rearranges within the existing Photoshop-style group.
 // Actual panels are keyed by data-panel, so their contents and the active selection
 // stay attached to the correct label, irrespective of order.
 const reorderStatus=document.createElement('span');
 reorderStatus.setAttribute('role','status');reorderStatus.setAttribute('aria-live','polite');
 reorderStatus.className='visually-hidden';document.querySelector('.dock').append(reorderStatus);
 let movingTab=null;
 function clearTabTargets(){document.querySelectorAll('.tab-drag-source,.tab-drop-before,.tab-drop-after').forEach(el=>el.classList.remove('tab-drag-source','tab-drop-before','tab-drop-after'));document.querySelectorAll('.tab-drop-end').forEach(el=>el.classList.remove('tab-drop-end'))}
 function reorderTab(button,target,before){
   const row=button.closest('.tab-row');
   if(!row||target?.closest('.tab-row')!==row)return false;
   const start=[...row.querySelectorAll('.tab')].map(el=>el.dataset.key).join(',');
   if(target&&target!==button){row.insertBefore(button,before?target:target.nextSibling)}
   else if(!target){row.insertBefore(button,row.querySelector('.hamburger'))}
   const end=[...row.querySelectorAll('.tab')].map(el=>el.dataset.key).join(',');
   if(start!==end){reorderStatus.textContent='已調整頁籤順序：'+[...row.querySelectorAll('.tab')].map(el=>labels[el.dataset.key]).join('、')}
   return start!==end;
 }
 document.querySelectorAll('.zone .tab-row').forEach(row=>{
   row.querySelectorAll('.tab').forEach(tab=>{
     tab.draggable=true;
     tab.title=(tab.title?tab.title+'；':'')+'拖曳可調整群組內順序';
     tab.addEventListener('dragstart',event=>{
       movingTab={button:tab,row};event.dataTransfer.effectAllowed='move';
       event.dataTransfer.setData('text/plain','ink-tab:'+tab.dataset.key);
       tab.classList.add('tab-drag-source');closeMenus();
     });
     tab.addEventListener('dragend',()=>{movingTab=null;clearTabTargets()});
     // Accessible fallback while retaining the Photoshop desktop mouse interaction.
     tab.addEventListener('keydown',event=>{
       if(!event.altKey||!['ArrowLeft','ArrowRight'].includes(event.key))return;
       event.preventDefault();
       const tabs=[...row.querySelectorAll('.tab')],i=tabs.indexOf(tab);
       const adjacent=tabs[i+(event.key==='ArrowLeft'?-1:1)];
       if(adjacent){reorderTab(tab,adjacent,event.key==='ArrowLeft');tab.focus()}
     });
   });
   row.addEventListener('dragover',event=>{
     if(!movingTab||movingTab.row!==row)return;
     event.preventDefault();event.dataTransfer.dropEffect='move';
     clearTabTargets();movingTab.button.classList.add('tab-drag-source');
     const target=event.target.closest('.tab');
     if(target&&target!==movingTab.button){
       target.classList.add(event.clientX<target.getBoundingClientRect().left+target.getBoundingClientRect().width/2?'tab-drop-before':'tab-drop-after');
     }else if(!target){row.classList.add('tab-drop-end')}
   });
   row.addEventListener('drop',event=>{
     if(!movingTab||movingTab.row!==row)return;
     event.preventDefault();
     const button=movingTab.button,target=event.target.closest('.tab');
     const before=target?event.clientX<target.getBoundingClientRect().left+target.getBoundingClientRect().width/2:false;
     reorderTab(button,target&&target!==button?target:target===button?button:null,before);
     movingTab=null;clearTabTargets();
   });
   row.addEventListener('dragleave',event=>{if(!row.contains(event.relatedTarget))clearTabTargets()});
 });
 // Standalone-only mouse geometry for draft review. It does not call native INK.
 let grip=null;document.querySelector('.dock-grab').addEventListener('pointerdown',e=>{grip={x:e.clientX,init:document.querySelector('.dock').getBoundingClientRect().width};e.target.setPointerCapture(e.pointerId)});document.querySelector('.dock-grab').addEventListener('pointermove',e=>{if(!grip)return;let w=Math.max(230,Math.min(520,grip.init+(grip.x-e.clientX)));shell.style.setProperty('--current-dock',w+'px')});['pointerup','pointercancel'].forEach(type=>document.querySelector('.dock-grab').addEventListener(type,()=>grip=null));
 let drag=null;document.querySelectorAll('.splitter').forEach(b=>{b.addEventListener('pointerdown',e=>{if(expanded!==null)return;drag={n:Number(b.dataset.split),y:e.clientY,one:zones[0].getBoundingClientRect().height,two:zones[1].getBoundingClientRect().height,h:document.querySelector('.dock').getBoundingClientRect().height};b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!drag)return;let dy=e.clientY-drag.y;let a=drag.one,c=drag.two;if(drag.n===0){a=Math.max(105,Math.min(drag.one+drag.two-100,drag.one+dy));c=drag.one+drag.two-a;}else{c=Math.max(100,Math.min(drag.h-drag.one-95,drag.two+dy))}root.style.setProperty('--zone-top',(a/drag.h*100)+'%');root.style.setProperty('--zone-middle',(c/drag.h*100)+'%')});['pointerup','pointercancel'].forEach(type=>b.addEventListener(type,()=>drag=null))});

 const hueEl=document.getElementById('previewHue'),hueIndicator=hueEl.querySelector('.ps-hue-indicator');let hueAngle=0;
 function setHueFromPointer(ev){const bb=hueEl.getBoundingClientRect();let n=Math.max(0,Math.min(1,(ev.clientY-bb.top)/bb.height));hueAngle=Math.round(360*n);hueIndicator.style.top=(n*100)+'%';hueEl.setAttribute('aria-valuenow',hueAngle);document.getElementById('previewColorPlane').style.background='linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent),hsl('+hueAngle+' 100% 50%)'}
 hueEl.addEventListener('pointerdown',e=>{hueEl.setPointerCapture(e.pointerId);setHueFromPointer(e)});hueEl.addEventListener('pointermove',e=>{if(e.buttons) setHueFromPointer(e)});hueEl.addEventListener('keydown',e=>{if(!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();hueAngle=(hueAngle+(e.key==='ArrowDown'?5:355))%360;hueIndicator.style.top=(hueAngle/360*100)+'%';hueEl.setAttribute('aria-valuenow',hueAngle)});

 document.querySelectorAll('.ps-align-button,.ps-style-icon,.ps-adjust-icon:not(:disabled)').forEach(b=>b.addEventListener('click',()=>{const group=b.closest('.ps-align-icons,.ps-style-grid,.ps-adjust-row');if(group)group.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')==='true'?'false':'true')}));
