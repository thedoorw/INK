<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f4">
  <title>INK｜灰底水滴開機動畫預覽 v2</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #f4f4f4; }
    *,*::before,*::after {box-sizing:border-box}
    html,body {width:100%;height:100%;margin:0;overflow:hidden;background:#f4f4f4}
    main {position:fixed;inset:0;display:grid;place-items:center;background:#f4f4f4;color:#647d8c}
    svg {display:block;width:220px;height:176px;max-width:60vw;overflow:visible}
    .controls {position:fixed;bottom:max(24px,env(safe-area-inset-bottom));right:max(24px,env(safe-area-inset-right));z-index:2}
    button {background:transparent;border:1px solid #ccd2d6;border-radius:6px;color:#65717a;padding:8px 12px;min-height:36px;cursor:pointer;font:12px/1.2 inherit}
    button:hover {background:#eaeef0}
    button:focus-visible {outline:2px solid #3d647d;outline-offset:2px}
    .sr-only {position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
  </style>
</head>
<body>
  <main aria-label="INK 灰底水滴開機動畫">
    <svg id="inkDropAnimation" class="ink-boot-scene" viewBox="0 0 120 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="每秒一滴水，落在一條短線上使它輕輕晃動">
      <path id="inkDrop" fill="#647d8c" d="M60 18C58.6 21 56 24 56 27a4 4 0 0 0 8 0c0-3-2.6-6-4-9Z" opacity="0">
        <animateTransform attributeName="transform" type="translate" values="0 0;0 33;0 33;0 0" keyTimes="0;0.68;0.79;1" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.95;0.95;0.35;0;0" keyTimes="0;0.12;0.68;0.74;0.79;1" dur="1s" repeatCount="indefinite"/>
      </path>
      <path id="inkLine" d="M40 64H80" fill="none" stroke="#647d8c" stroke-width="1.7" stroke-linecap="round">
        <animateTransform attributeName="transform" type="rotate" values="0 60 64;0 60 64;-3.2 60 64;2.2 60 64;-1.1 60 64;0.5 60 64;0 60 64" keyTimes="0;0.67;0.73;0.80;0.87;0.94;1" dur="1s" repeatCount="indefinite"/>
      </path>
    </svg>
    <span class="sr-only" role="status">INK 開機動畫示意，不包含實際程式載入</span>
  </main>
  <div class="controls"><button type="button" id="toggleAnimation" aria-pressed="false">暫停動畫</button></div>
  <script>
    (() => {
      const scene = document.getElementById('inkDropAnimation');
      const toggle = document.getElementById('toggleAnimation');
      if (!scene || !toggle) return;
      toggle.addEventListener('click', () => {
        const paused = scene.animationsPaused();
        if (paused) scene.unpauseAnimations();
        else scene.pauseAnimations();
        toggle.textContent = paused ? '暫停動畫' : '播放動畫';
        toggle.setAttribute('aria-pressed', paused ? 'false' : 'true');
      });
    })();
  </script>
</body>
</html>
