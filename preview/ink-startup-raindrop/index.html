<!doctype html>
<html lang="zh-Hant" data-ink-shell-ready="false">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f4f4">
  <title>INK — 開機水滴動畫預覽</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f4f4;
      color: #758795;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f4f4f4; }
    .ink-boot-gate {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-items: center;
      background: #f4f4f4;
      color: #758795;
    }
    .ink-boot-scene {
      display: block;
      width: 120px;
      height: 96px;
      max-width: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .ink-boot-drop {
      fill: currentColor;
      transform-origin: 60px 27px;
      animation: ink-boot-drop-fall 1s linear infinite;
    }
    .ink-boot-line {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.5;
      stroke-linecap: round;
      transform-origin: 60px 64px;
      animation: ink-boot-line-wobble 1s ease-in-out infinite;
    }
    .ink-boot-visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @keyframes ink-boot-drop-fall {
      0% { transform: translateY(0); opacity: 0; }
      8% { opacity: .9; }
      68% { transform: translateY(33px); opacity: .9; }
      73% { transform: translateY(33px) scale(1.1, .65); opacity: .35; }
      78%, 100% { transform: translateY(33px); opacity: 0; }
    }
    @keyframes ink-boot-line-wobble {
      0%, 67%, 100% { transform: translateY(0) rotate(0); }
      73% { transform: translateY(1px) rotate(-1.8deg); }
      80% { transform: translateY(0) rotate(1.1deg); }
      88% { transform: rotate(-.5deg); }
      95% { transform: rotate(.2deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .ink-boot-drop { animation: none; opacity: .9; transform: translateY(33px); }
      .ink-boot-line { animation: none; }
    }
  </style>
</head>
<body>
  <main id="inkBootGate" class="ink-boot-gate" role="status" aria-live="polite">
    <svg class="ink-boot-scene" viewBox="0 0 120 96" width="120" height="96" aria-hidden="true" focusable="false">
      <path class="ink-boot-drop" d="M60 18C58.6 21 56 24 56 27a4 4 0 0 0 8 0c0-3-2.6-6-4-9Z"/>
      <path class="ink-boot-line" d="M40 64H80"/>
    </svg>
    <span class="ink-boot-visually-hidden">INK 正在啟動</span>
  </main>
</body>
</html>
