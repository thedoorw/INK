touch-action:pan-y}\n/* Pixel-grid aligned fills avoid sub-pixel/antialiased soft hamburger strokes. */\n.hamburger svg{height:16px;width:16px;display:block;stroke:none!important;fill:#5e5e5e;shape-rendering:crispEdges;vector-effect:none}\n.hamburger{color:#5e5e5e}\n/* PS character arrow is ~14px wide at 252px Dock (not 18px). */\n.dock .panel .ps-char-select-shell:after{width:14px;border-left:1px solid #bcbcbc;background-position:center center;background-size:10px 10px}\n.dock .panel .ps-char-select-shell select{padding-right:16px}\n.dock .panel[data-panel=navigator] .ps-navframe{justify-content:center!important}\n.dock .panel[data-panel=color] #previewHue{overflow:visible;touch-action:none;cursor:ns-resize;border:1px solid #626262;box-sizing:border-box}\n\n\n/* White-on-gray Photoshop reference controls; Figma light surfaces retained. */\n/* Mountain endpoints are controls, not the draggable thumb. */\n.dock .panel[data-panel=navigator] .ps-nav-bottom .ps-mountain{font-size:0!important;transform:none!important;background-size:13px 10px;background-position:center;background-repeat:no-repeat}\n.dock .panel[data-panel=navigator] .ps-nav-bottom .ps-small-mountain{background-image:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2213%22%20height%3D%2210%22%20viewBox%3D%220%200%2013%2010%22%3E%3Cpath%20fill%3D%22%23888%22%20d%3D%22M0%208%20L3.6%203.2%20L5.1%205.1%20L7.4%202.4%20L13%208%20Z%22%2F%3E%3C%2Fsvg%3E\")}\n.dock .panel[data-panel=navigator] .ps-nav-bottom .ps-big-mountain{background-image:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%2213%22%20height%3D%2210%22%20viewBox%3D%220%200%2013%2010%22%3E%3Cpath%20fill%3D%22%23777%22%20d%3D%22M0%209%20L4.1%202.6%20L5.8%204%20L7.9%201%20L13%209%20Z%22%2F%3E%3C%2Fsvg%3E\")}\n/* 12x1 physical-pixel horizontal bars, separated by exact 4px y offsets.\n   No fractional SVG positioning, hairline stroke, CSS scaling or blur. */\n.dock .hamburger{position:relative}\n.dock .hamburger svg{display:none!important}\n.dock .hamburger::after{content:'';position:absolute;left:7px;top:10px;width:12px;height:1px;background:#424242;box-shadow:0 2px 0 #424242,0 4px 0 #424242,0 6px 0 #424242;transform:none;filter:none;pointer-events:none}\n/* In the PS 274px Color image: FG at ~x1016 and BG at ~x1026.\n   Preserve two independent stacked squares, their offset, white inset FG keyline. */\n.dock .panel[data-panel=color] .colors-small::before{position:absolute;content:'';left:13px;top:12px;width:20px;height:20px;border:1px solid #444;box-shadow:none;background:#fff;box-sizing:border-box;z-index:1}\n.dock .panel[data-panel=color] .colors-small::after{position:absolute;content:'';left:3px;top:2px;width:20px;height:20px;border:1px solid #4b4b4b;box-shadow:inset 0 0 0 1px #fff;background:var(--swatch-picked,#a54a42);box-sizing:border-box;z-index:2}\n\n/* UR3 R2.10 — USER 4-point pre-release draft correction (2026-10-25).\n   Minimum and default Dock width 240 in R2.11; menu bars 4×1px with 1px gaps.\n   Use Chromium's native bidirectional resize cursor on the Dock left boundary only;\n   the Navigator range track/thumb deliberately use the ordinary pointer arrow.\n   Prior R2.9 rules remain historical; these rules are the live CSS overrides. */\n.dock-grab,.dock-grab:hover,.dock-grab:active{cursor:ew-resize!important}\n.dock .panel[data-panel=navigator] #navZoom,\n.dock .panel[data-panel=navigator] #navZoom:hover,\n.dock .panel[data-panel=navigator] #navZoom:active{cursor:default!important}\n\n/* R2.11 DRAFT — ONE 11x11 PS pentagonal indicator for ALL controls.\n   11x11 is the smallest original R2.10 Navigator shape. Runtime unaffected. */\n:root{--dock:240px;--r211-slider-thumb:11px;--r211-track:2px;--r211-scrollbar:6px}\n.dock{min-width:240px}\n.ps-range,.dock .ps-range{appearance:none;-webkit-appearance:none;box-sizing:border-box;height:15px;min-height:15px;min-width:0;margin:0;padding:0;border:0!important;background:transparent;cursor:pointer}\n.ps-range::-webkit-slider-runnable-track{height:var(--r211-track);border:0;border-radius:0;background:#adb1b6}\n.ps-range::-moz-range-track{height:var(--r211-track);border:0;border-radius:0;background:#adb1b6}\n.ps-range::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;box-sizing:border-box;width:var(--r211-slider-thumb);height:var(--r211-slider-thumb);margin-top:-4.5px;border:0;border-radius:0;background:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2011%2011%22%3E%3Cpath%20d%3D%22M5.5%20.8L10%205.7V9.6H1V5.7Z%22%20fill%3D%22%23fff%22%20stroke%3D%22%23303030%22%20stroke-width%3D%221%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E\") center/11px 11px no-repeat;filter:none;box-shadow:none;transform:none}\n.ps-range::-moz-range-thumb{box-sizing:border-box;width:var(--r211-slider-thumb);height:var(--r211-slider-thumb);border:0;border-radius:0;background:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2011%2011%22%3E%3Cpath%20d%3D%22M5.5%20.8L10%205.7V9.6H1V5.7Z%22%20fill%3D%22%23fff%22%20stroke%3D%22%23303030%22%20stroke-width%3D%221%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E\") center/11px 11px no-repeat;filter:none;box-shadow:none;transform:none}\n/* Hue: same footprint and stroke, right-pointing arrow toward color strip. */\n.dock .panel[data-panel=color] .ps-hue-indicator{position:absolute;display:block;left:-10px;top:96%;width:var(--r211-slider-thumb);height:var(--r211-slider-thumb);border:0;transform:translateY(-50%);background:url(\"data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2011%2011%22%3E%3Cpath%20d%3D%22M1%201.1H5.3L10.2%205.5L5.3%209.9H1Z%22%20fill%3D%22%23fff%22%20stroke%3D%22%23303030%22%20stroke-width%3D%221%22%20stroke-linejoin%3D%22round%22%2F%3E%3C%2Fsvg%3E\") center/11px 11px no-repeat;filter:none;box-shadow:none;pointer-events:auto;cursor:ns-resize;touch-action:none;z-index:4}\n.dock .panel[data-panel=color] .ps-hue-indicator::before,.dock .panel[data-panel=color] .ps-hue-indicator::after{content:none!important;display:none!important;clip-path:none!important}\n/* All Chrome scrollbar tracks are 6px. Thumb LENGTH follows document content. */\n.dock *,.r211-new-box *{scrollbar-width:auto;scrollbar-color:auto}\n.dock *::-webkit-scrollbar,.r211-new-box *::-webkit-scrollbar{width:var(--r211-scrollbar);height:var(--r211-scrollbar)}\n.dock *::-webkit-scrollbar-track,.r211-new-box *::-webkit-scrollbar-track{background:#f6f6f6}\n.dock *::-webkit-scrollbar-thumb,.r211-new-box *::-webkit-scrollbar-thumb{border-radius:3px;background:#bfc0c2}\n.dock *::-webkit-scrollbar-button,.r211-new-box *::-webkit-scrollbar-button{display:none;width:0;height:0}\n\n/* PS Layers: dropdown left; opacity NUMBER right; small slider only when expanded. */\n.dock .panel[data-panel=layers] .ps-layer-blend{position:relative;display:flex;align-items:center;gap:5px;overflow:visible}\n.dock .panel[data-panel=layers] .ps-layer-blend select{flex:1 1 82px;width:auto;min-width:82px;max-width:none}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-layer-opacity{display:flex;align-items:center;justify-content:flex-end;flex:0 0 auto;gap:2px;white-space:nowrap;min-width:0}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-layer-opacity label{font-size:11px;line-height:16px;color:var(--muted);margin:0}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-layer-opacity input[type=number]{width:32px;min-width:32px;height:20px;min-height:20px;padding:0 1px;border:1px solid #dadada;border-radius:0;text-align:right;color:#444;font-size:11px;appearance:textfield;-moz-appearance:textfield}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-layer-opacity input::-webkit-inner-spin-button,.dock .panel[data-panel=layers] .ps-layer-blend .r211-layer-opacity input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-opacity-unit{font-size:11px;color:#666}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-opacity-toggle{height:20px;min-height:20px;width:14px;min-width:14px;border:0;border-radius:0;padding:0;color:#505050;background:#f7f7f7;font-size:12px}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-opacity-toggle[aria-expanded=true]{background:#e7edf1}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-opacity-popup{position:absolute;right:0;top:calc(100% + 2px);z-index:30;width:157px;height:34px;min-height:34px;display:flex;align-items:center;padding:0 10px;background:white;border:1px solid #c9c9c9;box-shadow:0 3px 10px #0002}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-opacity-popup[hidden]{display:none!important}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-opacity-popup>.ps-range{flex:1 1 auto;width:100%;min-width:0;height:15px}\n\n/* R2.11 240px audit: preserve color-chip footprint, clipped-safe marker, and narrow panel fields. */\n.dock .panel[data-panel=color] .colors-small{position:relative;width:34px;min-width:34px;height:44px;min-height:44px}\n.dock .panel[data-panel=color] .ps-color-cursor{width:9px;height:9px;box-sizing:border-box}\n.dock .panel[data-panel=color] .ps-color-row{grid-template-columns:34px minmax(0,1fr);overflow:visible}\n.dock .panel[data-panel=color] .ps-color-gradient{grid-template-columns:minmax(0,1fr) 19px;min-width:0}\n.dock .panel[data-panel=layers] .ps-layer-blend{min-width:0;width:100%}\n.dock .panel[data-panel=layers] .ps-layer-blend .r211-layer-opacity{max-width:calc(100% - 86px)}\n.dock .panel[data-panel=layers] .r211-layer-opacity-popup{max-width:calc(100vw - 30px)}\n.dock .panel[data-panel=layers] .ps-layer-locks{min-width:0}\n.r211-new-overlay{position:fixed;z-index:1000;inset:0;background:rgba(0,0,0,.14);display:grid;place-items:center;padding:20px}\n.r211-new-overlay[hidden]{display:none!important}\n.r211-new-box{background:#fff;border:1px solid #d5d5d5;border-radius:9px;box-shadow:0 16px 44px #0003;width:min(448px,calc(100vw - 40px));overflow:hidden;font-family:system-ui,'Segoe UI',sans-serif;font-size:12px}\n.r211-new-head{height:40px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid #ececec;font-size:14px}\n.r211-new-head button{width:26px;height:26px;min-height:26px;border:0;background:transparent;font-size:18px;color:#666}\n.r211-new-body{padding:12px 16px;display:grid;gap:8px}\n.r211-new-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}\n.r211-new-fields label{display:grid;gap:3px;font-size:11px;color:#757575}\n.r211-new-fields input,.r211-new-fields select{height:28px;min-width:0;width:100%;border:1px solid #d4d4d4;border-radius:4px;padding:0 7px;background:white;color:#444}\n.r211-new-options{display:flex;gap:6px;align-items:center;justify-content:space-between;color:#666;font-size:11px}\n.r211-new-note{font-size:11px;color:#707070;line-height:17px}\n.r211-new-foot{height:42px;display:flex;justify-content:flex-end;align-items:center;gap:7px;padding:0 12px;border-top:1px solid #ececec}\n.r211-new-foot button{height:29px;padding:0 12px;border:1px solid #ddd;border-radius:4px;background:white}\n.r211-new-foot .r211-close-primary{background:#242424;color:white;border-color:#242424}\n@media (max-width:1160px){.apphead .head-sub{display:none}.apphead .draft-stamp{font-size:10px}}\n\n/* Restrict R2.11 unchanged internal dock interaction to its Master Draft viewport */\nheader.apphead,.left-rail,.workspace,.dock-grab{display:none!important}\n.shell{height:100dvh!important;--current-dock:100%!important}\n.dock{left:0!important;right:0!important;top:0!important;bottom:0!important;width:100%!important;min-width:0!important;border-left:0!important}\n\n/* v0.2 embedded R2.11 phone sheet — same 10 existing tab IDs and panel DOM. */\n#mobileDockTabs{display:none}\n@media (max-width:760px), (max-height:480px) and (pointer:coarse) en;b.setAttribute('aria-expanded',String(!open))}));\n document.addEventListener('click',e=>{if(!e.target.closest('.pop-menu'))closeMenus()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenus()});\n document.querySelectorAll('[data-expand-zone]').forEach(b=>b.addEventListener('click',()=>{let n=Number(b.dataset.expandZone);expanded=expanded===n?null:n;zones.forEach((z,i)=>{z.dataset.expanded=String(i===expanded);z.classList.toggle('compacted',expanded!==null&&i!==expanded)});document.querySelectorAll('[data-expand-zone]').forEach(x=>x.textContent=expanded===null?'展開目前面板區':'還原三區');closeMenus()}));\n function updateDoc(){document.querySelector('#btnDoc').classList.toggle('active',hasDoc);document.querySelector('#btnNoDoc').classList.toggle('active',!hasDoc);document.querySelector('#docTitle').textContent='INK_demo.psd · 100%';document.querySelector('#docTitle').hidden=!hasDoc;document.querySelector('#docTitle').nextElementSibling.hidden=!hasDoc;document.getElementById('artDoc').hidden=!hasDoc;document.getElementById('workspaceEmpty').hidden=hasDoc;document.getElementById('workspaceEmpty').setAttribute('aria-label','尚未開啟文件');document.getElementById('navThumbnail').hidden=!hasDoc;document.querySelectorAll('[data-document-required]').forEach(x=>{x.hidden=!hasDoc});document.querySelectorAll('.panel[data-panel=\"navigator\"],.panel[data-panel=\"character\"],.panel[data-panel=\"paragraph\"],.panel[data-panel=\"brushes\"],.panel[data-panel=\"adjustments\"],.panel[data-panel=\"layers\"],.panel[data-panel=\"history\"],.panel[data-panel=\"paths\"]').forEach(panel=>{panel.querySelectorAll('button,input,select,textarea').forEach(control=>{if(control.dataset.originalDisabled===undefined)control.dataset.originalDisabled=String(control.disabled);control.disabled=hasDoc?control.dataset.originalDisabled==='true':true})});document.querySelector('#statusText').textContent=hasDoc?'有文件示意狀態':'無文件示意狀態';const navNumber=document.getElementById('navZoomNumber');if(navNumbe get("mobileTemplateMenu").addEventListener("click",e=>{const b=e.target.closest("[data-template]");if(b)template(b.dataset.template)});
get("mobileSheetClose").addEventListener("click",()=>viewState("canvas"));scrim.addEventListener("click",()=>viewState("canvas"));
get("mobilePhotoInput").addEventListener("change",e=>{const file=e.target.files[0];if(!file||!file.type.startsWith("image/"))return;const url=URL.createObjectURL(file),img=new Image();
img.onload=()=>{if(photoURL)URL.revokeObjectURL(photoURL);photoURL=url;photo=img;picture.src=url;template("photo")};img.onerror=()=>{URL.revokeObjectURL(url);alert("這張相片無法預覽")};img.src=url;e.target.value=""});
function showCursor(e){
  if(!eraser||!media.matches||view!=="canvas"){cursor.hidden=true;return}
  cursor.style.setProperty("--cursor-size",size+"px");
  cursor.style.left=e.clientX+"px";cursor.style.top=e.clientY+"px";
  cursor.dataset.size="擦 "+size;cursor.hidden=false;
}
function hideCursor(){cursor.hidden=true}
get("mobileUndo").addEventListener("click",()=>{if(strokes.length)redo.push(strokes.pop());paint();hintState()});
get("mobileRedo").addEventListener("click",()=>{if(redo.length)strokes.push(redo.pop());paint();hintState()});
ink.addEventListener("pointerdown",e=>{if(!media.matches||view!=="canvas"||demoTool==="catalog"||active||e.button>0)return;if(e.pointerType==="touch"&&e.isPrimary===false)return;e.preventDefault();active={points:[pt(e)],color:colors[color],size,eraser};showCursor(e);ink.setPointerCapture?.(e.pointerId);hintState()});
ink.addEventListener("pointermove",e=>{if(!active){if(e.pointerType!=="touch")showCursor(e);return}if(!ink.hasPointerCapture?.(e.pointerId))return;e.preventDefault();showCursor(e);active.points.push(pt(e));paint()});
ink.addEventListener("pointerleave",()=>{if(!active)hideCursor()});
function up(e,cancel){if(!active||!ink.hasPointerCapture?.(e.pointerId))return;if(!cancel){active.points.push(pt(e));strokes.push(active);redo=[]}active=null;if(cancel||e.pointerType==="touch")hideCursor();paint();hintState()}
ink.addEventListener("pointerup",e=>up(e,false));ink.addEventListener("pointercancel",e=>up(e,true));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&media.matches&&view!=="canvas")viewState("canvas")});
media.addEventListener("change",()=>{if(!media.matches)viewState("canvas");requestAnimationFrame(paint)});
window.addEventListener("resize",()=>requestAnimationFrame(paint));
/* v0.4 Fullscreen API: opt-in button only; no auto fullscreen or manifest mutation. */
const fullscreenButton=get("mobileFullscreenToggle");
const fullscreenNotice=document.createElement("div");
fullscreenNotice.id="mobileFullscreenNotice";
fullscreenNotice.setAttribute("role","status");
fullscreenNotice.setAttribute("aria-live","polite");
fullscreenNotice.hidden=true;
root.append(fullscreenNotice);
const desktopFullscreenExit=document.createElement("button");
desktopFullscreenExit.id="mobileDesktopFullscreenExit";
desktopFullscreenExit.type="button";
desktopFullscreenExit.textContent="退出全螢幕";
desktopFullscreenExit.setAttribute("aria-label","退出全螢幕");
desktopFullscreenExit.hidden=true;
root.append(desktopFullscreenExit);
let fullscreenNoticeTimer=0;
function fullscreenFeedback(message){
  clearTimeout(fullscreenNoticeTimer);
  fullscreenNotice.textContent=message;
  fullscreenNotice.hidden=false;
  fullscreenNoticeTimer=setTimeout(()=>{fullscreenNotice.hidden=true},4200);
}
function syncFullscreenUI(){
  const active=!!document.fullscreenElement;
  fullscreenButton.setAttribute("aria-pressed",String(active));
  const label=active?"退出全螢幕":"進入全螢幕";
  fullscreenButton.setAttribute("aria-label",label);
  fullscreenButton.title=label;
  fullscreenButton.textContent=active?"↙":"⛶";
  root.dataset.mobileFullscreen=String(active);
  // PC breakpoint may change as fullscreen expands; never rely on the mobile-only topbar.
  desktopFullscreenExit.hidden=!active||media.matches;
}
async function exitPreviewFullscreen(){
  if(!document.fullscreenElement)return;
  try{await document.exitFullscreen()}
  catch(err){fullscreenFeedback("無法退出全螢幕；請試 Esc 或 F11。")}
}
desktopFullscreenExit.addEventListener("click",()=>{void exitPreviewFullscreen()});
document.addEventListener("keydown",e=>{
  // Do not block the browser's own Esc handling.
  if(e.key==="Escape"&&document.fullscreenElement)void exitPreviewFullscreen();
});
media.addEventListener("change",syncFullscreenUI);
fullscreenButton.addEventListener("click",async()=>{
  // Request/exit is made directly in the real click handler; user activation is not awaited away.
  try{
    if(document.fullscreenElement){
      await exitPreviewFullscreen();
    }else{
      if(typeof document.documentElement.requestFullscreen!=="function"){
        fullscreenFeedback("此瀏覽器不支援全螢幕；一般 Chrome 分頁仍會顯示網址列。");
        return;
      }
      await document.documentElement.requestFullscreen();
    }
  }catch(err){
    fullscreenFeedback("無法切換全螢幕；請確認瀏覽器權限或使用已安裝的 PWA。");
  }
});
document.addEventListener("fullscreenchange",()=>{
  syncFullscreenUI();
  requestAnimationFrame(paint);
});
document.addEventListener("fullscreenerror",()=>fullscreenFeedback("瀏覽器拒絕全螢幕要求。"));
window.INK_MOBILE_V04=Object.freeze({getState(){
  const displayMode=document.fullscreenElement?"api-fullscreen":
    window.matchMedia("(display-mode: fullscreen)").matches?"pwa-fullscreen":
    window.matchMedia("(display-mode: standalone)").matches?"pwa-standalone":"browser";
  return{apiSupported:typeof document.documentElement.requestFullscreen==="function",
    apiActive:!!document.fullscreenElement,displayMode,
    viewportWidth:window.innerWidth,viewportHeight:window.innerHeight,
    visualViewportHeight:window.visualViewport?.height??null,
    mobileView:root.dataset.mobileView??null,
    template:mode};
}});
syncFullscreenUI();
renderQuick();template("photo");viewState("canvas");
window.INK_MOBILE_V06=Object.freeze({getState:()=>({quickPage,demoTool,eraser,brushSize:size,quickMenuOpen:!quickMenu.hidden,barCount:2,orientationDeferred:true,previewOnly:true})});
requestAnimationFrame(paint);
})();
