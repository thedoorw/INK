<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>INK｜等弦波真正移動 v2｜固定線長</title>
<style>
:root {--bg:#f1f0ec;--blue:#69bfe3;--muted:#617986;--panel:rgba(255,255,255,.78);--border:rgba(105,191,227,.35)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;overflow:hidden}
body{background:var(--bg);font:13px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:var(--muted)}
main{position:fixed;inset:0;min-height:100dvh;isolation:isolate;overflow:hidden;background:var(--bg)}
main::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 72% 65% at 46% 32%,rgba(255,255,255,.46),transparent 86%),radial-gradient(ellipse 65% 63% at 75% 86%,rgba(172,189,190,.055),transparent 90%)}
#scene{position:absolute;inset:0;width:100%;height:100%;display:block;overflow:visible}
#equalWave{fill:none;stroke:var(--blue);stroke-width:1.45;stroke-linecap:round;stroke-linejoin:round}
.top{position:fixed;top:max(14px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);padding:6px 13px;border:1px solid rgba(105,191,227,.2);border-radius:20px;background:rgba(255,255,255,.55);font-size:11px;color:#748992;text-align:center;max-width:calc(100vw - 24px)}
.controls{position:fixed;left:50%;bottom:max(19px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(650px,calc(100vw - 24px));padding:11px 12px;background:rgba(255,255,255,.75);border:1px solid var(--border);border-radius:15px;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}
button{font:inherit;white-space:nowrap;border:1px solid var(--border);border-radius:18px;background:var(--panel);color:#426475;padding:6px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input[type=range]{flex:1;min-width:130px;accent-color:#69bfe3}
#phase{font-variant-numeric:tabular-nums;color:#788d95;min-width:34px;text-align:center}
.note{position:fixed;bottom:calc(max(19px,env(safe-area-inset-bottom)) + 73px);left:50%;transform:translateX(-50%);font-size:11px;color:#8a9aa1;text-align:center;white-space:nowrap}
@media (max-width:550px){.controls{gap:7px;padding:11px}.note{bottom:calc(max(19px,env(safe-area-inset-bottom)) + 105px);white-space:normal;width:calc(100% - 40px)}input[type=range]{min-width:100px}}
</style>
</head>
<body>
<main role="img" aria-label="固定長度的完整線條上，對稱等弦波的兩側波峰從中央向左右流動">
  <svg id="scene" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false"><path id="equalWave" d=""/></svg>
  <div class="top">整條線固定長度｜等弦波沿線左右流動｜無水滴、無文字</div>
  <div class="note">拖曳時間軸：觀察波峰位置移動，而非線長改變</div>
  <div class="controls" role="group" aria-label="動畫預覽控制（正式 INK 不顯示）">
    <button id="play" type="button">暫停</button>
    <button id="replay" type="button">重播</button>
    <input id="timeline" type="range" min="0" max="1000" step="1" value="0" aria-label="動畫進度">
    <span id="phase">0%</span>
    <button id="crest" type="button">定格等弦波</button>
  </div>
</main>
<script>
(()=>{
  'use strict';
  const svg=document.getElementById('scene');
  const wave=document.getElementById('equalWave');
  const slider=document.getElementById('timeline');
  const progressText=document.getElementById('phase');
  const playButton=document.getElementById('play');
  const DURATION=2600;
  const REFERENCE=0.6130368568946075; // exact solution: smooth(REFERENCE) = 2/3 -> phase 0
  const clamp=x=>Math.max(0,Math.min(1,x));
  const smooth=x=>{const t=clamp(x);return t*t*(3-2*t)};
  const fmt=x=>Number(x).toFixed(4);
  let g,progress=0,running=false,raf=0,origin=0;

  function measure(){
    const w=innerWidth||1280,h=innerHeight||800;
    const length=2*h/(9*Math.sqrt(3)); // same full span as v4.9; never changes in the animation
    const amplitude=Math.max(1.5,h/9*0.0225);
    g={w,h,cx:w/2,cy:h/2,length,startX:w/2-length/2,endX:w/2+length/2,amplitude};
    svg.setAttribute('viewBox',`0 0 ${fmt(w)} ${fmt(h)}`);
  }
  function hermite(y0,m0,y1,m1,t,span){
    const t2=t*t,t3=t2*t;
    return (2*t3-3*t2+1)*y0+(t3-2*t2+t)*span*m0+(-2*t3+3*t2)*y1+(t3-t2)*span*m1;
  }
  // Same spatial sine carrier as v4.9: when phase=0, the extrema are
  // x = cx +/- length/3 (two identical crests) and x=cx (one trough).
  // Unlike v1, the PHASE moves continuously, so these crest locations travel.
  // q = 2*abs(x-cx)/length is mirror-symmetric; cubic joins at centre and
  // endpoints keep the curve smooth and preserve the full horizontal span.
  function travelingEqualSine(q,phi){
    const k=1.5*Math.PI;
    const f=z=>Math.cos(k*z-phi);
    const fp=z=>-k*Math.sin(k*z-phi);
    const c=.035;
    if(q<c) return hermite(f(0),0,f(c),fp(c),q/c,c);
    const edge=.92;
    if(q>edge) return hermite(f(edge),fp(edge),0,0,(q-edge)/(1-edge),1-edge);
    return f(q);
  }
  function dynamics(p){
    const phase=-Math.PI+1.5*Math.PI*smooth(p); // continuous outward-traveling carrier
    const attack=smooth(p/.10);
    const decay=1-smooth((p-.70)/.30);
    return {phi:phase,amplitude:g.amplitude*attack*decay};
  }
  function curve(p){
    const d=dynamics(p);
    let value='';
    const n=400;
    for(let i=0;i<=n;i++){
      const u=i/n;
      const x=g.startX+g.length*u;
      const q=Math.abs(u-.5)*2;
      const y=g.cy+d.amplitude*travelingEqualSine(q,d.phi);
      value+=(i?' L ':'M ')+fmt(x)+' '+fmt(y);
    }
    return value;
  }
  function render(p){
    progress=clamp(p);
    // Endpoints are the same at every frame; no clipping or width scaling.
    wave.setAttribute('d',curve(progress));
    slider.value=String(Math.round(progress*1000));
    progressText.textContent=Math.round(progress*100)+'%';
  }
  function stop(){running=false;cancelAnimationFrame(raf);raf=0;playButton.textContent='播放'}
  function frame(now){
    if(!running)return;
    const p=(now-origin)/DURATION;
    if(p>=1){render(1);stop();return}
    render(p);raf=requestAnimationFrame(frame);
  }
  function start(from=progress){
    cancelAnimationFrame(raf);running=true;origin=performance.now()-clamp(from)*DURATION;
    playButton.textContent='暫停';raf=requestAnimationFrame(frame);
  }
  function seek(p){stop();render(p)}
  function resize(){measure();render(progress)}
  addEventListener('resize',resize,{passive:true});
  document.getElementById('play').addEventListener('click',()=>running?stop():start(progress>=1?0:progress));
  document.getElementById('replay').addEventListener('click',()=>{render(0);start(0)});
  document.getElementById('crest').addEventListener('click',()=>seek(REFERENCE));
  slider.addEventListener('input',()=>seek(Number(slider.value)/1000));
  window.__inkEqualWavePreview={
    seek,play:start,stop,replay:()=>{render(0);start(0)},
    geometry:()=>({...g}),
    dynamics:p=>dynamics(p),
    sample:(u,p)=>g.cy+dynamics(p).amplitude*travelingEqualSine(Math.abs(u-.5)*2,dynamics(p).phi),
    wavePath:p=>curve(p),reference:REFERENCE,duration:DURATION
  };
  measure();render(0);
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches)start(0);
  else {render(REFERENCE);stop()}
})();
</script>
</body>
</html>
