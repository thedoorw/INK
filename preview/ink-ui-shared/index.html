<!doctype html>
<html lang="zh-Hant" data-ui="ink017" data-ink-host="MOCK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>INK UI · Same-source Preview (Mock)</title>
  <link rel="stylesheet" href="../../src/ui/ink017/tokens.css">
  <style>
    #mockControls{position:fixed;bottom:10px;left:54px;z-index:120;background:#fff;color:#222;border:1px solid #bbb;border-radius:5px;padding:5px;display:flex;gap:5px;align-items:center;font:12px system-ui;box-shadow:0 2px 9px #0002}
    #mockControls button{min-height:25px}#mockControls [aria-pressed="true"]{background:#dceeff;border-color:#579bdf}
    html[data-preview-clean="true"] #mockControls{display:none}
    .preview-page{background:#fff;width:min(42vh,45%);aspect-ratio:210/297;box-shadow:0 3px 18px #0002;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
    .preview-empty{font:14px system-ui;color:#777;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);white-space:nowrap}
  </style>
</head>
<body>
  <div id="app"></div>
  <nav id="mockControls" aria-label="Preview fixtures">
    <span>MOCK · No Core</span>
    <button type="button" data-fixture="a4">A4 fixture</button>
    <button type="button" data-fixture="empty">No document</button>
    <button type="button" data-fixture="selection">Selected object</button>
    <button type="button" id="hideFixtureControls">Hide</button>
  </nav>
  <script type="module" src="./preview-entry.js"></script>
</body>
</html>
