<!doctype html>
<html lang="zh-Hant" data-ui="ink017" data-ink-host="MOCK">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>INK UI MASTER · Public Same-source Preview (Mock)</title>
  <!-- Same order and exact stylesheet bytes as the Real INK entry. -->

  <link rel="stylesheet" href="../../src/ui/ink017/tokens.css">

<body>

  <nav id="mockControls" aria-label="UI MASTER Preview controls">

    <label for="mockFixture">狀態</label>

      <option value="a4">A4 空白文件</option>
      <option value="empty">未開啟文件</option>
      <option value="selection">選取向量物件</option>
      <option value="image">選取影像</option>

      <option value="locked">鎖定圖層</option>
      <option value="history">含歷史記錄</option>

    <button type="button" id="mockDialog">示例對話框</button>
    <button type="button" id="mockRefresh">刷新 UI</button>
    <button type="button" id="hideFixtureControls">隱藏控制</button>
    <output id="mockLiveStatus" role="status" aria-live="polite">僅 Mock Host · 不連真作品</output>

  <!-- Same pure DOM builder as Real, never the IO-owning branding controller. -->
  <script type="module" src="./preview-entry.js"></script>
