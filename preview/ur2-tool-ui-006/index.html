const shell=document.getElementById('shell'),toolArea=shell.querySelector('.tool-area'),bar=shell.querySelector('.context-float'),ctx=shell.querySelector('#contextControls'),identity=shell.querySelector('#contextIdentity'),review=document.getElementById('ur2Review'),menu=document.getElementById('toolGroupMenu');

function renderRail(){

}
function selectGroup(i,j=state.variants[i]){state.group=i;state.variants[i]=j;closeMenu();renderRail();renderContext();renderReview();}
let hold=null,suppress=false,opener=null;
function closeMenu(){if(menu.matches(':popover-open'))menu.hidePopover();opener?.setAttribute('aria-expanded','false');opener=null}
function openMenu(i,button,index=0){
 closeMenu();opener=button;
 const g=catalog[i];
 menu.innerHTML=g.tools.map((label,j)=>'<button type="button" class="drawing-tool-option" role="menuitemradio" data-variant="'+j+'" aria-checked="'+(i===state.group&&state.variants[i]===j)+'">'+iconFor(g,j)+'<span>'+label+'</span></button>').join('');
 menu.setAttribute('aria-label',g.n);
 const rect=button.getBoundingClientRect();menu.style.left=Math.min(Math.max(8,rect.right+6),Math.max(8,innerWidth-190))+'px';menu.style.top=Math.max(8,rect.top)+'px';
 menu.showPopover();menu.style.top=Math.min(parseFloat(menu.style.top),Math.max(8,innerHeight-menu.offsetHeight-8))+'px';
 button.setAttribute('aria-expanded','true');
 menu.querySelectorAll('button')[(index+g.tools.length)%g.tools.length]?.focus();
}
toolArea.addEventListener('click',e=>{const b=e.target.closest('[data-group]');if(!b)return;if(suppress){suppress=false;return}selectGroup(Number(b.dataset.group))});
toolArea.addEventListener('contextmenu',e=>{const b=e.target.closest('[data-group]');if(!b)return;const i=Number(b.dataset.group);if(catalog[i].tools.length<2)return;e.preventDefault();openMenu(i,b)});
toolArea.addEventListener('pointerdown',e=>{const b=e.target.closest('[data-group]');if(!b||e.button!==0)return;const i=Number(b.dataset.group);if(catalog[i].tools.length<2)return;clearTimeout(hold);suppress=false;hold=setTimeout(()=>{hold=null;suppress=true;openMenu(i,b)},450)});
for(const kind of ['pointerup','pointercancel','pointerleave'])toolArea.addEventListener(kind,()=>clearTimeout(hold));

menu.addEventListener('keydown',e=>{const arr=[...menu.querySelectorAll('button')],i=arr.indexOf(document.activeElement);if(e.key==='Escape'){e.stopPropagation();closeMenu();return}if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();arr[e.key==='Home'?0:e.key==='End'?arr.length-1:(i+(e.key==='ArrowDown'?1:-1)+arr.length)%arr.length]?.focus()}});

const cssSafe=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
function control([name,type,val,choices],disabled=false){
 let input='';
 if(type==='sel')input='<select aria-label="'+cssSafe(name)+'"'+(disabled?' disabled':'')+'>'+String(choices||val).split('|').map(x=>'<option'+(x===val?' selected':'')+'>'+cssSafe(x)+'</option>').join('')+'</select>';
 else if(type==='range')input='<input class="shared-slider" type="range" aria-label="'+cssSafe(name)+'" min="0" max="100" value="'+cssSafe(val)+'"'+(disabled?' disabled':'')+'><output>'+val+'</output>';
 else if(type==='check')input='<input type="checkbox" aria-label="'+cssSafe(name)+'"'+(val==='true'?' checked':'')+(disabled?' disabled':'')+'>';
 else if(type==='color')input='<input type="color" aria-label="'+cssSafe(name)+'" value="'+cssSafe(val)+'"'+(disabled?' disabled':'')+'>';
 else if(type==='btn')input='<button type="button"'+(disabled?' disabled':'')+'>'+cssSafe(name)+'</button>';
 else input='<input type="'+(type==='num'?'number':'text')+'" aria-label="'+cssSafe(name)+'" value="'+cssSafe(val)+'"'+(disabled?' disabled':'')+'>';
 return '<label class="field-row'+(disabled?' ur2-pending':'')+'">'+(type==='btn'?'':'<span>'+cssSafe(name)+'</span>')+input+'</label>';
}
function renderContext(){
 const g=catalog[state.group],r=C[g.id]||[],p=CP[g.id]||[];
 identity.textContent=g.tools[state.variants[state.group]];bar.classList.add('tools-context');
 const host='<div id="contextToolOptions"><div class="context-parameter-group" role="group" aria-label="'+cssSafe(g.n)+' 選項"><fieldset>'+r.map(x=>control(x,false)).join('')+'</fieldset></div></div>';
 ctx.innerHTML=host+'<div id="transformControls" hidden></div>';
 bar.classList.toggle('expanded',state.expanded);el('#contextToggle').setAttribute('aria-expanded',String(state.expanded));
 if(!state.expanded)return;
 const options=el('#contextToolOptions'),fields=[...options.querySelectorAll('.field-row')];
 if(bar.scrollWidth<=bar.clientWidth+1&&p.length===0)return;
 const more=document.createElement('button');more.className='context-drawing-more';more.textContent='更多';more.setAttribute('aria-controls','toolOptionsMore');more.setAttribute('aria-expanded','false');
 const extra=document.createElement('div');extra.id='toolOptionsMore';extra.className='context-more-menu';extra.setAttribute('popover','auto');extra.setAttribute('role','group');extra.setAttribute('aria-label','更多工具選項');
 options.append(more,extra);
 const disabled=document.createElement('fieldset');disabled.disabled=true;disabled.setAttribute('aria-label','未實作或待核實能力');
 disabled.innerHTML=p.map(x=>control(x,true)).join('');extra.append(disabled);
 for(const f of fields.slice().reverse()){if(bar.scrollWidth<=bar.clientWidth+1)break;extra.prepend(f)}
 more.onclick=()=>{if(extra.matches(':popover-open')){extra.hidePopover();return}const rect=more.getBoundingClientRect();extra.style.left=Math.min(rect.left,Math.max(8,innerWidth-276))+'px';extra.style.top='8px';extra.showPopover();extra.style.top=Math.max(8,rect.top-extra.getBoundingClientRect().height-6)+'px';more.setAttribute('aria-expanded','true')};
 extra.addEventListener('toggle',()=>more.setAttribute('aria-expanded',String(extra.matches(':popover-open'))));
 extra.addEventListener('keydown',e=>{if(e.key==='Escape'){e.stopPropagation();extra.hidePopover();more.focus()}});
}

function measurePreview(){
 const metrics={at:new Date().toISOString(),source:'UR2 v006 public-main CSS as read 2026-10-27; demonstration, not live Native',viewport:{width:innerWidth,height:innerHeight},state:{group:catalog[state.group].id,variant:catalog[state.group].tools[state.variants[state.group]],railDouble:shell.classList.contains('rail-double')},pending:allPending,rects:{},styles:{}};
 for(const [name,selector] of Object.entries({shell:'#shell',rail:'.left-rail',tools:'.tool-area',firstTool:'.tool-button',swatches:'.rail-colors',context:'.context-float',more:'.context-drawing-more',dock:'#rightDock',navigatorSlider:'.navigator-controls .shared-slider'})){
   const node=el(selector);if(!node)continue;
   const r=node.getBoundingClientRect(),c=getComputedStyle(node);
   metrics.rects[name]={x:+r.x.toFixed(2),y:+r.y.toFixed(2),width:+r.width.toFixed(2),height:+r.height.toFixed(2),bottom:+r.bottom.toFixed(2)};
   metrics.styles[name]={display:c.display,position:c.position,padding:c.padding,gap:c.gap,overflowX:c.overflowX,overflowY:c.overflowY,background:c.backgroundColor};
 }
 metrics.dom={groupButtons:document.querySelectorAll('.tool-button[data-group]').length,subtoolRows:catalog.reduce((n,g)=>n+g.tools.length,0),pendingItems:allPending,menuWithinShell:shell.contains(menu),contextHost:shell.contains(ctx),publicMainCssBlob:'b64d54e73d45529a9b1192ef52bd50c2eaa291ff',privateMainCssBlob:'e456087713e1ffe2c182c8bf3e6a811f27479b78',publicPrivateCssIdentical:false,publishedSourceCss:true};
 return metrics;
}
