# REVIEW-ONLY replacement. Existing required check name and trusted BASE execution retained.
name: INK Public Release Gate 001
on:
  pull_request:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
permissions:
  contents: read
concurrency:
  group: ink-public-release-gate-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  verifier-self-test:
    name: ${{ github.event_name == 'pull_request_target' && 'public-release-verifier-selftest' || 'inactive-public-release-verifier-selftest' }}
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test engineering/public-release/static-sync.test.mjs
  control-candidate-self-test:
    name: ${{ github.event_name == 'pull_request' && 'public-release-control-selftest' || 'inactive-public-release-control-selftest' }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test engineering/public-release/static-sync.test.mjs
  trusted-release-pr:
    name: ${{ github.event_name == 'pull_request_target' && 'public-release-candidate-verify' || 'inactive-public-release-candidate-verify' }}
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Reject Draft before checkout
        uses: actions/github-script@v7
        with:
          script: |
            if(context.payload.pull_request.draft)throw Error('DRAFT_CANDIDATE');
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Trusted BASE integrity only; Private QA and USER authorization remain review obligations
        run: node trusted/engineering/public-release/verify-static-sync.mjs trusted candidate
